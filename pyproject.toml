[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyhydra"
version = "0.1.6"
description = "Modular Python library for hydrological and climate analysis"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
  {name = "Salvador Navas", email = "salvador.navas@alumnos.unican.es"},
]
keywords = ["hydrology", "climate", "flood", "rainfall", "stochastic"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Hydrology",
]

dependencies = [
    "numpy",
    "pandas",
    "xarray",
    "dask[array]",
    "scipy",
    "statsmodels",
    "scikit-learn",
    "matplotlib",
    "tqdm",
    "openturns",
    "requests",
]

[project.urls]
Homepage = "https://github.com/navass11/pyhydra"
Repository = "https://github.com/navass11/pyhydra"
Documentation = "https://github.com/navass11/pyhydra/tree/main/notebooks"

[project.optional-dependencies]
# Bare GDAL bindings, kept separate because they are the most
# platform-sensitive piece to install (see README).
geo = ["gdal"]
# Bayesian/copula/regional-frequency statistics.
statistics = ["pymc", "pyvinecopulib", "lmoments3"]
# Geospatial data access and interpolation.
geospatial = ["geopandas", "rasterio", "pykrige", "earthaccess", "hydromt_sfincs"]
# Hydrological/hydraulic model adapters and stochastic generators.
models = ["hecdss", "pySWATPlus", "spotpy", "NEOPRENE"]
all = ["pyhydra[geo,statistics,geospatial,models]"]

[project.scripts]
pyhydra-get-data = "pyhydra.data.download:_main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyhydra*"]

[tool.pytest.ini_options]
markers = [
    "optional_dependency: requires an optional heavy dependency (e.g. PyMC/pytensor) and its native toolchain; not part of the essential test set",
]
