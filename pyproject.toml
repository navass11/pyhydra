[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyhydra"
version = "0.1.0"
description = "Modular Python library for hydrological and climate analysis"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
  {name = "Salvador Navas", email = "salvador.navas@alumnos.unican.es"},
]
keywords = ["hydrology", "climate", "flood", "rainfall", "stochastic"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Hydrology",
]

dependencies = [
    "numpy",
    "pandas",
    "xarray",
    "dask[array]",
    "scipy",
    "statsmodels",
    "scikit-learn",
    "matplotlib",
    "tqdm",
    "openturns",
    "requests",
]

[project.urls]
Homepage = "https://hidralab.com"
Repository = "https://github.com/navass11/pyhydra"
Documentation = "https://github.com/navass11/pyhydra/tree/main/notebooks"

[project.optional-dependencies]
geo = ["gdal"]
all = ["pyhydra[geo]"]

[project.scripts]
pyhydra-get-data = "pyhydra.data.download:_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pyhydra*"]
