name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pyhydra and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov spotpy rasterio

      - name: Run test suite
        run: |
          pytest -v --cov=pyhydra --cov-report=term-missing

      - name: Report deselected optional-dependency tests
        if: always()
        run: |
          pytest -q -m optional_dependency -rs || true
