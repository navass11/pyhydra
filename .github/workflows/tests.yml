name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pyhydra and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov spotpy rasterio lmoments3 pymc

      - name: Run test suite
        run: |
          pytest -v --cov=pyhydra --cov-report=term-missing

      - name: Report deselected optional-dependency tests
        if: always()
        run: |
          pytest -q -m optional_dependency -rs || true
