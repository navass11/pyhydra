services:

  jupyter:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8888:8888"
    environment:
      - PYTHONPATH=/pyhydra
    volumes:
      # Notebooks are mounted from the host so edits and outputs persist
      - ../notebooks:/pyhydra/notebooks
      # Local data workspace used by notebooks and pyhydra-get-data
      - ../data:/pyhydra/data
    restart: unless-stopped
