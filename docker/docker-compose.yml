services:

  jupyter:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8888:8888"
    environment:
      - PYTHONPATH=/pyhydra
    volumes:
      # Notebooks are mounted from the host so edits and outputs persist
      - ../notebooks:/pyhydra/notebooks
      # Optional: mount a local data directory for notebook inputs/outputs
      # - ./data:/pyhydra/data
    restart: unless-stopped
